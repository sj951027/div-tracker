name: daily-rank
on:
  schedule:
    - cron: '10 7 * * 1-5'    # UTC 07:10 = KST 16:10 (월~금) → 한국장 마감 직후, KR만 갱신
    - cron: '10 23 * * 1-5'   # UTC 23:10 (월~금) → US만 갱신. 서머타임 안전:
                              #   여름(EDT, UTC-4) = 마감 16:00 후 3시간10분 / 겨울(EST, UTC-5) = 후 2시간10분
                              #   → 어느 시제든 yfinance 일봉 정정 여유 2시간+ 확보 (KST 아침 08:10)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas numpy
      - run: python fetch_rank.py --market ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit data
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data $(date -u +%Y%m%d-%H%M)"
          git pull --rebase || true
          git push
