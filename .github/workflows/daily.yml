name: daily-rank
on:
  schedule:
    - cron: '30 11 * * 1-5'   # UTC 11:30 = KST 20:30 (월~금) → KR만 갱신. [v1.4] 16:10에서 이동:
                              #   야후가 장중·시간외 세션 중 일부 펀드형 KR 종목의 가격 이력을
                              #   ~2개월로 잘라 반환(2026-08 실측 7종, 밤에는 정상) → KRX 시간외
                              #   (18:00)·NXT 애프터마켓(20:00) 종료 후로 회피. EOD 지연 이슈도 해소.
    - cron: '10 23 * * 1-5'   # UTC 23:10 (월~금) → US만 갱신. 서머타임 안전:
                              #   여름(EDT, UTC-4) = 마감 16:00 후 3시간10분 / 겨울(EST, UTC-5) = 후 2시간10분
                              #   → 어느 시제든 yfinance 일봉 정정 여유 2시간+ 확보 (KST 아침 08:10)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas numpy
      - run: python fetch_rank.py --market ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit data
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data $(date -u +%Y%m%d-%H%M)"
          git pull --rebase || true
          git push
